name: drupal-three-js-theme
type: drupal
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mariadb
    version: "11.4"
use_dns_when_possible: true
composer_version: "2"
performance_mode: "mutagen"
nodejs_version: "20"
corepack_enable: false

# World descriptors + vectors live in Drupal's own database
# (world_signature_descriptor); no external store or sidecar. Atlas and
# the RESTHeart sidecar were retired in 2026-10 (see docs/SHIP.md §A1).

# Vite dev server exposure (npm run dev runs on container port 5173,
# DDEV-router exposes it on https://drupal-three-js-theme.ddev.site:5173)
web_extra_exposed_ports:
    - name: vite
      container_port: 5173
      http_port: 5172
      https_port: 5173

# Sandbox property credentials. Empty in committed config; engineer
# overrides locally via .ddev/.env or `ddev config --web-environment-add`.
# The embedding service (WORLD_EMBED_URL/_MODEL/_DIM, see docs/SHIP.md
# §A2) is machine-specific and lives only in .ddev/.env; unset, the
# world falls back to the dev TF-IDF embedder.
web_environment:
    - ANTHROPIC_API_KEY=

hooks:
    post-start:
        - exec: composer install --no-interaction
